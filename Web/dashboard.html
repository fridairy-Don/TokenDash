<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420, initial-scale=1">
<title>TokenDash</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #FCFBF7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #1C1A16; } }
  #root { width: 100%; height: 100%; }
  @keyframes td-blink {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1.0; }
  }
  @keyframes td-pulse {
    0%, 100% { opacity: 1.0; }
    50%      { opacity: 0.55; }
  }
  /* Refresh-icon rotation. Used on manual refresh to prove the click registered. */
  @keyframes td-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
  ::-webkit-scrollbar-track { background: transparent; }
  button:focus { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
